_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, a UK department's real travel policy: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one traveller's flight request under the Defra Staff Expense (Travel & Subsistence) Policy (published August 2021), read verbatim. It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares in pounds) and submits a decision with the offer, cabin, reason, approver and policy section. A deterministic verifier rebuilds the offers and the policy's answer itself and checks every field. Twenty-four cases cover journey lengths on both sides of each limit, flights within mainland Great Britain, the first-class ban and its overseas exception, the cases that allow business class, safety, personal trips, and the policy's own unclear words."
highlights:
  - "The verbatim policy: no paraphrase, no rules restated in the task"
  - "Exact boundaries: 299 against 301 scheduled minutes, 600 against 601"
  - "Unclear clauses become holds for approval, each once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example bracken-stile, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and date"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the policy's answer and checks every field"
